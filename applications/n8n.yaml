apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: n8n
  namespace: default
  labels:
    name: n8n
spec:
  project: default
  source:
    repoURL: https://github.com/Nohbidy/HomeLabInfra.git
    path: kustomize/n8n
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: argocd
    syncOptions:
      - CreateNamespace=true
