apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  labels:
    name: alloy
spec:
  project: default
  sources:
    - repoURL: 'https://grafana.github.io/helm-charts'
      chart: alloy
      targetRevision: 1.2.1
      helm:
        valueFiles:
          - $values/kustomize/alloy/values.yaml
    - repoURL: https://github.com/Nohbidy/HomeLabInfra.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
